# The same gate as `pnpm run check` (scripts/check.sh), for when this repo is
# pushed to GitHub. Production deploys from the Replit workspace, so on Replit
# run `pnpm run check` before publishing; this only adds the same run on push.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/db push --force
      - run: pnpm run check
