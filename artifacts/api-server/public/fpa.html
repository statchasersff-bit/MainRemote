<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
    Title, description, canonical and the OG/Twitter tags are rendered here by
    the server (src/lib/fpa-seo.ts). Nothing below is set or amended by
    JavaScript: a crawler that never runs the bundle still receives the final
    values, and the canonical is a plain tag rather than something applied at
    runtime.
  -->
  <!--SSR-HEAD-->
  <!--
    This URL is the raw tool. The public page is
    https://statchasers.com/nfl/fantasy-points-allowed-by-position/, and
    WordPress owns the canonical, title, description and schema there.
    `noindex` keeps this address out of the index on its own;
    `indexifembedded` lets Google still use the content when it is embedded in
    a page that permits indexing. See also the X-Robots-Tag in
    src/routes/fpa.ts.
  -->
  <meta name="robots" content="noindex, indexifembedded" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- The 32 team crests come from the same CDN the news cards already use. -->
  <link rel="preconnect" href="https://sleepercdn.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/fpa.css" />
</head>
<body class="scf-page<!--SSR-BODY-CLASS-->">
  <!--SSR-->
  <script src="/dist/statchasers-fpa.js" defer></script>
</body>
</html>
