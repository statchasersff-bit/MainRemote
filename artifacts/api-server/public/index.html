<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StatChasers — NFL Player News Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="brand">
        <span class="brand-icon">⚡</span>
        <span class="brand-name">StatChasers</span>
      </div>
      <button id="refreshBtn" class="refresh-btn">
        <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M15.312 11.424a5.5 5.5 0 01-9.201 2.466l-.312-.311h2.433a.75.75 0 000-1.5H3.989a.75.75 0 00-.75.75v4.242a.75.75 0 001.5 0v-2.43l.31.31a7 7 0 0011.712-3.138.75.75 0 00-1.449-.39zm1.23-3.723a.75.75 0 00.219-.53V2.929a.75.75 0 00-1.5 0V5.36l-.31-.31A7 7 0 003.239 8.188a.75.75 0 101.448.389A5.5 5.5 0 0113.89 6.11l.311.31h-2.432a.75.75 0 000 1.5h4.243a.75.75 0 00.53-.219z" clip-rule="evenodd" />
        </svg>
        Refresh
      </button>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <h1 class="hero-title">
          Fantasy Football Player News
          <span class="gold-underline"></span>
        </h1>
        <p class="hero-desc">
          A saved archive of recent NFL player news sourced from Dynasty Command.
        </p>
      </div>
    </section>

    <section class="news-section">
      <div class="container">
        <div id="statusBar" class="status-bar hidden"></div>
        <div id="newsList" class="news-list">
          <div class="loading-state">
            <div class="spinner"></div>
            <p>Loading news…</p>
          </div>
        </div>
        <div id="emptyState" class="empty-state hidden">
          <p class="empty-icon">📋</p>
          <p class="empty-title">No news yet</p>
          <p class="empty-sub">Hit Refresh to pull the latest headlines from Dynasty Command.</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>StatChasers &mdash; NFL news sourced from <strong>Dynasty Command</strong></p>
    </div>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
