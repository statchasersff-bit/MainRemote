<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Marks scripting as on before first paint, so a recap's tab panels hide
       at once rather than after the bundle runs (see .sct-mu-tabs in team.css). -->
  <script>document.documentElement.classList.add("js");</script>
  <!--
    Title, description, canonical and the OG/Twitter tags are rendered here by
    the server (src/lib/matchup/matchup-seo.ts). Nothing below is set or amended by
    JavaScript: a crawler that never runs the bundle still receives the final
    values, and the canonical is a plain tag rather than something applied at
    runtime.
  -->
  <!--SSR-HEAD-->
  <!--
    This URL is the raw tool. The public matchup page is
    https://statchasers.com/nfl/<a>-vs-<b>/, and WordPress owns the canonical,
    title, description and schema there. `noindex` keeps this address out of the
    index on its own; `indexifembedded` lets Google still use the content when
    it is embedded in a page that permits indexing. The canonical above is
    self-referencing - pointing a noindex page's canonical at another URL would
    be a contradictory signal. See also the X-Robots-Tag in src/routes/matchup.ts.
  -->
  <meta name="robots" content="noindex, indexifembedded" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <!-- The scoreboard hero's own type: see .sct-sbh in team.css. -->
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/team.css" />
</head>
<body class="sct-page<!--SSR-BODY-CLASS-->">
  <!--SSR-->
  <script src="/dist/statchasers-team.js" defer></script>
</body>
</html>
